<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Planif Muscu</title>
<meta name="theme-color" content="#16201a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planif Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : barre programme en haut, onglets semaines, éditeur de séances à gauche, bilan musculaire à droite (empilé sur mobile) */
:root{
  --bg:#eef1ee; --surface:#ffffff; --sunk:#f6f8f6; --ink:#16201a; --muted:#5b6860; --line:#d5dcd6;
  --accent:#1f4e79; --accent-ink:#ffffff; --gold:#c8961c; --gold-soft:#f4e7c4; --danger:#a1281b; --ok:#2f7d4f;
  --n1:#1f4e79; --n2:#c8961c; --n3:#8a978f;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#171f1a; --sunk:#121915; --ink:#e6ebe7; --muted:#97a39c; --line:#2a352e;
  --accent:#6fa8dc; --accent-ink:#0f1512; --gold:#e0b44a; --gold-soft:#3a3018; --danger:#ef7a6a; --ok:#6cc08b;
  --n1:#6fa8dc; --n2:#e0b44a; --n3:#7c8a82; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#171f1a; --sunk:#121915; --ink:#e6ebe7; --muted:#97a39c; --line:#2a352e;
  --accent:#6fa8dc; --accent-ink:#0f1512; --gold:#e0b44a; --gold-soft:#3a3018; --danger:#ef7a6a; --ok:#6cc08b;
  --n1:#6fa8dc; --n2:#e0b44a; --n3:#7c8a82; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;max-width:1440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;line-height:1.2}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;color:var(--muted)}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button.danger{color:var(--danger)}
button.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{border-color:var(--accent);outline:none}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;line-height:1}
.brand span{color:var(--gold)}
.progbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 420px;min-width:0}
#progSel{max-width:220px}
#progName{flex:1 1 200px;font-weight:600}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.err{color:var(--danger)}

.weekbar{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;min-width:0}
.cgroup{display:flex;flex-direction:column;gap:4px}
.clabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{font-family:var(--display);font-weight:600;font-size:17px;padding:4px 12px;border-radius:6px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab.cycle{border-style:dashed}
.weekactions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.weekactions label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.weekactions input{width:64px}

.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
@media (min-width:1080px){.layout{grid-template-columns:minmax(0,1fr) 380px}}
.weekhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.weekhead h2{font-family:var(--display);font-size:30px;margin:0;line-height:1}
.weekhead label{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;flex:1 1 260px}
.weekhead input{flex:1;min-width:0}
.editor{display:flex;flex-direction:column;gap:14px}
.session{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.shead{display:flex;gap:8px;align-items:center}
.shead input{flex:1;font-weight:600;font-size:15px;border-color:transparent;background:transparent;padding-left:4px}
.shead input:hover{border-color:var(--line)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%}
.rows{min-width:700px}
.rows th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:left;padding:4px 4px 6px}
.rows td{padding:3px 4px;vertical-align:middle}
.rows td.c-ex{width:46%}
.rows input{width:100%}
.rows input.n{text-align:right;font-family:var(--mono)}
.rows .c-ton{text-align:right;white-space:nowrap;color:var(--muted)}
.lvl{display:inline-grid;place-items:center;width:26px;height:22px;border-radius:5px;font-family:var(--mono);font-size:12px;font-weight:500}
.lvl.l1{background:var(--n1);color:var(--accent-ink)}
.lvl.l2{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--n2)}
.lvl.l3{box-shadow:inset 0 0 0 1px var(--n3);color:var(--muted)}
.lvl.lx{box-shadow:inset 0 0 0 1px var(--danger);color:var(--danger)}
.sfoot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty h3{font-family:var(--display);font-size:24px;margin:0}

aside{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:14px;min-width:0}
@media (min-width:1080px){aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}}
aside h3{font-family:var(--display);font-size:22px;margin:0;line-height:1}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:8px;padding:8px 10px}
.kpi b{display:block;font-family:var(--mono);font-size:20px;font-weight:500}
.kpi span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.lvlrow{display:flex;gap:6px;flex-wrap:wrap}
.lvlpill{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.mus th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500;text-align:right;padding:2px 4px}
.mus th:first-child{text-align:left}
.mus td{padding:3px 4px;font-size:13px;text-align:right;white-space:nowrap}
.mus td:first-child{text-align:left}
.mus td.bar{width:38%}
.mname{border:0;background:none;padding:2px 0;text-align:left;font:inherit;color:var(--ink);display:flex;gap:5px;align-items:center}
.mname::before{content:"▸";font-size:10px;color:var(--muted);transition:transform .15s}
.mname[aria-expanded="true"]::before{transform:rotate(90deg)}
.mname:hover{color:var(--accent)}
tr.open td{background:var(--sunk)}
td.mdet{white-space:normal!important;text-align:left!important;padding:8px!important;background:var(--sunk)}
.mdet h4{margin:0 0 4px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.mdet .blk{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.mdet .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mdet select{font-size:12px;padding:4px 6px}
.mdet button{font-size:12px;padding:4px 8px}
.sugg{display:flex;flex-wrap:wrap;gap:4px}
.sugg button{border-radius:999px}
.contrib{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;font-size:12px}
.contrib .who{min-width:0}
.contrib .who small{display:block;color:var(--muted)}
.contrib .acts{display:flex;gap:4px}
.role{font-family:var(--mono);font-size:10px;padding:1px 4px;border-radius:3px;margin-right:4px}
.role.P{background:var(--accent);color:var(--accent-ink)}
.role.S{background:var(--gold-soft);color:var(--ink)}
.undo{display:flex;gap:8px;align-items:center;font-size:12px;background:var(--gold-soft);border-radius:8px;padding:6px 10px}
.undo span{flex:1;min-width:0}
.nonelist{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.nonelist button{font-size:12px;padding:2px 8px;border-radius:999px;border-style:dashed}
.bar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.bar i.sec{background:var(--gold)}
.note{font-size:12px;color:var(--muted);margin:0}
.coef{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.coef input{width:70px}
.idle{color:var(--muted)}

.matrix{font-size:13px}
.matrix th,.matrix td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.matrix th:first-child,.matrix td:first-child{text-align:left;position:sticky;left:0;background:var(--surface)}
.matrix thead th{font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);vertical-align:bottom}
.matrix thead .cyc{color:var(--ink);text-transform:none;letter-spacing:0;font-size:12px;text-align:left;border-bottom:2px solid var(--gold)}
.matrix tfoot td{font-weight:600}
.cyclebox{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto}

details.custom{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
details.custom summary{cursor:pointer;font-weight:600}
.cform{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.cform .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;padding:3px 8px;border-radius:999px}
.chip[aria-pressed="true"].p{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip[aria-pressed="true"].s{background:var(--gold-soft);border-color:var(--gold)}
.clist{font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.clist div{display:flex;gap:8px;align-items:center}

.exin{display:flex;gap:4px;align-items:center}
.layout.solo{grid-template-columns:minmax(0,1fr)!important;max-width:720px;margin:0 auto;width:100%}
body.logmode #weekbar, body.logmode #customBox, body.logmode #bkExp, body.logmode #bkImp, body.logmode #dupProg, body.logmode #delProg, body.logmode #newProg, body.logmode #progName{display:none}
.logtop{display:flex;flex-direction:column;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px}
.logtop .line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.logtop select,.logtop input[type=date]{min-height:40px}
.sesschips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.sesschips button{white-space:nowrap;min-height:40px;border-radius:999px;padding:6px 14px}
.sesschips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.prog{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.prog .track{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.prog .track i{display:block;height:100%;background:var(--ok)}
.lcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.lcard.complete{border-color:var(--ok)}
.lhead{display:flex;gap:8px;align-items:center}
.lhead h4{margin:0;font-size:16px;font-weight:600;flex:1;min-width:0}
.presc{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.lmus{font-size:12px;color:var(--muted);margin-top:-4px}
.setrow,.sethead{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 62px 46px;gap:6px;align-items:center}
.sethead{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);text-align:center;margin-bottom:-4px}
.setrow select{min-height:44px;font-family:var(--mono);font-size:15px;text-align:center;padding:4px 2px;width:100%}
.setrow select.set{border-color:var(--gold)}
.setrow .sn{font-family:var(--mono);color:var(--muted);text-align:center}
.setrow input{min-height:44px;text-align:center;font-family:var(--mono);font-size:16px;width:100%}
.setrow .x,.setrow .u{color:var(--muted);font-size:12px;text-align:center}
.tick{min-height:44px;border-radius:10px;font-size:18px;color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.setrow.done input{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.lfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lfoot select{min-height:36px}
.lfoot .sp{flex:1}
textarea{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px;width:100%;min-height:70px}
.bigbtn{min-height:48px;font-size:15px;width:100%}
.kind{font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:1px 6px;border-radius:4px;font-weight:600;margin-right:4px}
.kind.add{background:var(--gold-soft);color:var(--ink)}
.kind.sub{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--ink)}
.sumtab td{white-space:normal!important;vertical-align:top}
.sumtab td:first-child{min-width:130px}
.neg{color:var(--danger)} .pos{color:var(--ok)}
.stfilters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;align-items:end}
.stfilters .chk{min-height:38px}
.stfilters select{width:100%;min-height:38px}
.kpis4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi span{display:block}
.chart{position:relative;width:100%;min-height:120px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--mono)}
.chart .lab{fill:var(--ink);font-size:12px;font-family:var(--mono);font-weight:500}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .dot.on{r:6}
.chart .dot.hollow{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .mk{fill:var(--accent)}
.chart .mk.on{fill:color-mix(in srgb,var(--accent) 75%,var(--ink))}
.chart .guide{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;line-height:1.4;box-shadow:0 4px 14px color-mix(in srgb,var(--ink) 14%,transparent);max-width:220px;z-index:2}
h4.sub{margin:6px 0 0;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
details.data summary{cursor:pointer;font-size:12px;color:var(--muted)}
.mvt td.bar i{display:block;height:8px;border-radius:4px;background:var(--accent);min-width:2px}
.mvt tr.sel td,.bestrm tr.sel td{background:var(--sunk)}
.tab.dl{border-style:dashed;color:var(--muted)}
.weekhead label.chk{flex:0 0 auto;color:var(--ink);font-size:13px}
.weekhead input[type=checkbox]{flex:0 0 auto;width:auto}
.tab.dl[aria-selected="true"]{color:var(--bg)}
.tab small{font-size:12px;margin-left:2px}
.wktools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.wktools .grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wktools select{max-width:260px}
.goalgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media (min-width:980px){.goalgrid{grid-template-columns:minmax(0,1fr)}}
.gblock{display:flex;flex-direction:column;gap:10px;min-width:0}
.gblock .line{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.gform{display:grid;grid-template-columns:minmax(0,2fr) 84px 80px minmax(0,1.3fr) auto;gap:6px}
@media (max-width:600px){.gform{grid-template-columns:minmax(0,1fr) 84px 80px}.gform input[type=date]{grid-column:1/3}}
.goals td{vertical-align:top;white-space:normal!important}
.goals td small{display:block}
.goals .gcell{min-width:80px}
.pbar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pbar.ok i{background:var(--ok)}
.goals .proj{font-size:12px}
.chart .tgt{stroke:var(--ok);stroke-width:1.5;stroke-dasharray:6 4}
.chart .tgtl{fill:var(--ok);font-size:11px;font-family:var(--mono)}
@media (max-width:600px){.goals th:nth-child(4),.goals td:nth-child(4){display:none}}
.chart .fit{stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.spark{display:block}
.spark .sp-ln{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linejoin:round}
.spark .sp-fit{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.spark .sp-dot{fill:var(--accent)}
.tfgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:980px){.tfgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.layout.solo.wide{max-width:1040px}
.tfcols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.tfh{font-size:12px;font-weight:600;margin:6px 0 4px}
ol.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.rank li{display:grid;grid-template-columns:22px minmax(0,1fr) 96px 96px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
ol.rank li:last-child{border-bottom:0}
.rk{font-family:var(--display);font-size:20px;font-weight:700;color:var(--muted)}
.rkname{min-width:0;display:flex;flex-direction:column}
.rkname .mname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;display:block}
.rkname .mname::before{display:none}
.rkname small{font-size:11px;color:var(--muted)}
.rkv{text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
.bestrm td{vertical-align:middle}
@media (max-width:420px){ol.rank li{grid-template-columns:20px minmax(0,1fr) 84px}.rk{font-size:17px}ol.rank li .spark{display:none}}
.mvt td.bar{min-width:70px;width:30%}
@media (max-width:600px){.mvt td.bar,.mvt th:nth-child(3){display:none}
  .bestrm th:nth-child(3),.bestrm td:nth-child(3),.bestrm th:nth-child(4),.bestrm td:nth-child(4){display:none}
  .bestrm .spark{width:64px;height:auto}
  .mvt td:first-child,.bestrm td:first-child{white-space:normal!important}
  .mvt .mname,.bestrm .mname{text-align:left}}
body.statsmode .weekactions, body.statsmode #customBox{display:none}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.step h3{font-family:var(--display);font-size:22px;margin:0;display:flex;gap:10px;align-items:baseline}
.step h3 .no{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:16px}
.step .line{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.alloc{min-width:520px}
.alloc th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:4px;text-align:center;vertical-align:bottom}
.alloc th:first-child{text-align:left}
.alloc td{padding:3px 4px;text-align:center}
.alloc td:first-child{text-align:left;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alloc input.n{width:52px;text-align:center;font-family:var(--mono)}
.alloc .sname{display:flex;gap:2px;align-items:center;justify-content:center}
.alloc .sname input{width:96px;font-size:12px;text-align:center}
.alloc tfoot td{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:6px;vertical-align:top}
.rest{font-family:var(--mono);font-size:12px}
.rest.bad{color:var(--danger);font-weight:600}
.rest.good{color:var(--ok)}
.mini{font-size:11px;color:var(--muted)}
.tgt td{padding:4px 3px;font-size:13px;white-space:nowrap}
.tgt th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;padding:2px 3px;text-align:right}
.tgt th:first-child{text-align:left}
.tgt input{width:44px;padding:3px 4px;text-align:center;font-family:var(--mono);font-size:12px}
.tgt td.gcell{width:30%}
.gauge{position:relative;height:12px;border-radius:3px;background:var(--sunk);overflow:hidden}
.gauge .band{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ok) 22%,transparent)}
.gauge .fill{position:absolute;left:0;top:3px;height:6px;border-radius:3px;background:var(--muted)}
.st-under .fill{background:var(--danger)} .st-ok .fill{background:var(--ok)} .st-over .fill{background:var(--gold)}
.st-under .val{color:var(--danger)} .st-ok .val{color:var(--ok)} .st-over .val{color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:6px;border-radius:2px;margin-right:4px;vertical-align:middle}
.exin input{flex:1}
.browse{padding:5px 8px;font-size:12px;white-space:nowrap}
.picker{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;justify-content:flex-end}
.pk-panel{background:var(--surface);width:min(620px,100%);height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) 16px;gap:10px;border-left:1px solid var(--line)}
.pk-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pk-head h3{font-family:var(--display);font-size:26px;margin:0;line-height:1}
.pk-head .note{flex:1;min-width:0}
.pk-filters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:center}
.pk-filters .full{grid-column:1/-1}
.pk-filters select,.pk-filters input[type=search]{width:100%}
.flab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font-size:13px;padding:5px 10px;border-radius:999px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.pk-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:6px}
.pk-list{overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:2px;padding-right:4px}
.pk-cat{font-family:var(--display);font-size:17px;margin:10px 0 2px;color:var(--ink)}
.pk-sub{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:6px 0 2px}
.pk-item{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:2px 8px;align-items:center;text-align:left;border-color:transparent;background:transparent;padding:6px 6px;border-radius:6px;width:100%}
.pk-item:hover{background:var(--sunk);border-color:var(--line)}
.pk-item .nm{font-weight:500}
.pk-item .ms{grid-column:2/4;font-size:12px;color:var(--muted)}
.pk-item .ms b{color:var(--ink);font-weight:500}
.pk-item mark{background:var(--gold-soft);color:var(--ink);border-radius:3px;padding:0 2px}
.pk-item .add{font-size:12px;color:var(--accent);opacity:0}
.pk-item:hover .add,.pk-item:focus-visible .add{opacity:1}
.pk-item.done .add{opacity:1;color:var(--gold)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .25s ease}}

cat":"Haltérophilie & dérivés","sub":"Poussée balistique","fam":"Push press / jeté","name":"Push press","lvl":1,"mat":"Barre / haltères","p":["Delto antérieur","Delto moyen","Triceps","Quadriceps","Fessiers"],"s":["Trapèze sup.","Mollets"]},{"id":"EX132","cat":"Haltérophilie & dérivés","sub":"Poussée balistique","fam":"Push press / jeté","name":"Jeté fendu (split jerk)","lvl":2,"mat":"Barre","p":["Delto antérieur","Delto moyen","Triceps","Quadriceps","Fessiers"],"s":[]},{"id":"EX133","cat":"Haltérophilie & dérivés","sub":"Poussée balistique","fam":"Push press / jeté","name":"Jeté Landmine","lvl":2,"mat":"Landmine","p":["Delto antérieur","Triceps","Quadriceps","Fessiers"],"s":[]},{"id":"EX134","cat":"Pliométrie & balistique","sub":"Sauts verticaux","fam":"Sauts","name":"Squat jump","lvl":2,"mat":"PDC / charge légère","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios"]},{"id":"EX135","cat":"Pliométrie & balistique","sub":"Sauts verticaux","fam":"Sauts","name":"CMJ barre","lvl":2,"mat":"Barre légère","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios","Lombaires"]},{"id":"EX136","cat":"Pliométrie & balistique","sub":"Sauts verticaux","fam":"Sauts","name":"Trap bar jump","lvl":2,"mat":"Trap bar","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios"]},{"id":"EX137","cat":"Pliométrie & balistique","sub":"Sauts verticaux","fam":"Sauts sur box","name":"Jumpbox lestés","lvl":2,"mat":"Box + gilet / haltères","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios"]},{"id":"EX138","cat":"Pliométrie & balistique","sub":"Sauts verticaux","fam":"Sauts sur box","name":"Saut Départ Assis KB/H","lvl":2,"mat":"Banc + box + KB/haltère","p":["Fessiers","Quadriceps"],"s":["Ischios","Mollets"]},{"id":"EX139","cat":"Pliométrie & balistique","sub":"Réactif","fam":"Sauts réactifs","name":"Drop jump","lvl":2,"mat":"Box","p":["Mollets","Quadriceps","Fessiers"],"s":["Ischios"]},{"id":"EX140","cat":"Pliométrie & balistique","sub":"Horizontal","fam":"Sauts horizontaux","name":"Broad jump / bonds unipodaux","lvl":2,"mat":"PDC","p":["Fessiers","Ischios","Quadriceps"],"s":["Mollets"]},{"id":"EX141","cat":"Pliométrie & balistique","sub":"Médecine-ball","fam":"Lancers","name":"Twist Medball","lvl":2,"mat":"Médecine-ball","p":["Abdos / obliques"],"s":["Fessiers","Grand dorsal","Pectoraux"]},{"id":"EX142","cat":"Pliométrie & balistique","sub":"Médecine-ball","fam":"Lancers","name":"Lancer de poitrine médecine-ball","lvl":2,"mat":"Médecine-ball","p":["Pectoraux","Triceps","Delto antérieur"],"s":[]},{"id":"EX143","cat":"Pliométrie & balistique","sub":"Médecine-ball","fam":"Lancers","name":"Med ball slam","lvl":2,"mat":"Médecine-ball","p":["Grand dorsal","Abdos / obliques"],"s":["Triceps"]},{"id":"EX144","cat":"Traîneau & prowler","sub":"Poussée","fam":"Prowler","name":"Prowler 15m lourd","lvl":2,"mat":"Prowler","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios","Pectoraux","Triceps"]},{"id":"EX145","cat":"Traîneau & prowler","sub":"Poussée","fam":"Prowler","name":"Prowler lourd 10 mètres","lvl":2,"mat":"Prowler","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios","Pectoraux","Triceps"]},{"id":"EX146","cat":"Traîneau & prowler","sub":"Poussée","fam":"Prowler","name":"Prowler vitesse 10m","lvl":2,"mat":"Prowler","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios","Pectoraux","Triceps"]},{"id":"EX147","cat":"Traîneau & prowler","sub":"Tiré","fam":"Traîneau","name":"SLED","lvl":2,"mat":"Traîneau + harnais","p":["Fessiers","Ischios","Quadriceps"],"s":["Mollets"]},{"id":"EX148","cat":"Traîneau & prowler","sub":"Tiré","fam":"Traîneau","name":"Sled Marché","lvl":2,"mat":"Traîneau + harnais","p":["Quadriceps","Fessiers","Mollets"],"s":["Ischios"]},{"id":"EX149","cat":"Traîneau & prowler","sub":"Tiré","fam":"Traîneau","name":"Reverse Drag Prowler","lvl":2,"mat":"Prowler / traîneau + sangles","p":["Quadriceps"],"s":["Mollets"]},{"id":"EX150","cat":"Traîneau & prowler","sub":"Tiré","fam":"Traîneau","name":"Traîneau tiré bras (rope / row)","lvl":2,"mat":"Traîneau + corde/sangles","p":["Grand dorsal","Biceps","Haut du dos"],"s":["Avant-bras"]},{"id":"EX151","cat":"Tronc – Gainage & rotation","sub":"Anti-extension","fam":"Planche","name":"Planche (± lest)","lvl":3,"mat":"PDC / disque","p":["Abdos / obliques"],"s":["Fessiers"]},{"id":"EX152","cat":"Tronc – Gainage & rotation","sub":"Anti-extension","fam":"Roulette","name":"Roulette abdominale (ab wheel)","lvl":3,"mat":"Roulette","p":["Abdos / obliques"],"s":["Grand dorsal"]},{"id":"EX153","cat":"Tronc – Gainage & rotation","sub":"Anti-extension","fam":"Dead bug","name":"Dead bug","lvl":3,"mat":"PDC / élastique","p":["Abdos / obliques"],"s":[]},{"id":"EX154","cat":"Tronc – Gainage & rotation","sub":"Anti-flexion latérale","fam":"Planche latérale","name":"Planche latérale","lvl":3,"mat":"PDC","p":["Abdos / obliques","Lombaires"],"s":["Fessiers"]},{"id":"EX155","cat":"Tronc – Gainage & rotation","sub":"Anti-rotation","fam":"Pallof","name":"Pallof press","lvl":3,"mat":"Poulie / élastique","p":["Abdos / obliques"],"s":["Fessiers"]},{"id":"EX156","cat":"Tronc – Gainage & rotation","sub":"Rotation","fam":"Landmine rotation","name":"Landmine rotation","lvl":3,"mat":"Landmine","p":["Abdos / obliques"],"s":["Delto antérieur","Delto moyen","Fessiers"]},{"id":"EX157","cat":"Tronc – Gainage & rotation","sub":"Porters","fam":"Porters","name":"Farmer walk","lvl":3,"mat":"Haltères / trap bar / poignées","p":["Trapèze sup.","Avant-bras"],"s":["Fessiers","Mollets"]},{"id":"EX158","cat":"Tronc – Gainage & rotation","sub":"Porters","fam":"Porters","name":"Suitcase carry","lvl":3,"mat":"Haltère / KB","p":["Abdos / obliques","Lombaires"],"s":["Avant-bras","Fessiers"]},{"id":"EX159","cat":"Cou","sub":"Cou","fam":"Cou 4 faces","name":"Nuque Ceinture 4 Faces","lvl":3,"mat":"Harnais de tête + charge","p":["Cou","Trapèze sup."],"s":[]},{"id":"EX160","cat":"Cou","sub":"Cou","fam":"Cou 4 faces","name":"4 Faces sur banc 30° élastique","lvl":3,"mat":"Banc 30° + élastique","p":["Cou","Trapèze sup."],"s":[]},{"id":"EX161","cat":"Cou","sub":"Cou","fam":"Cou 4 faces","name":"Isométrie cervicale contre partenaire","lvl":3,"mat":"Partenaire / main","p":["Cou","Trapèze sup."],"s":[]}]}</script>
<script>
(() => {
const STANDALONE = true;
const LOCAL_TXT = STANDALONE ? 'Enregistré sur cet appareil' : 'Enregistré dans ce navigateur';
const DATA = JSON.parse(document.getElementById('libdata').textContent);
const GROUPS = DATA.groups;
const LVL_TXT = {1:'Global / principal',2:'Polyarticulaire secondaire',3:'Isolation / complément'};
const $ = s => document.querySelector(s);
const norm = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const num = v => { const x = parseFloat(String(v??'').replace(',', '.')); return isFinite(x) ? x : 0; };
const fmt = (x, d=0) => x.toLocaleString('fr-FR', {maximumFractionDigits:d, minimumFractionDigits:0});
const fmtT = kg => kg >= 1000 ? fmt(kg/1000, 1) + ' t' : fmt(kg) + ' kg';
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));

/* ---------- état ---------- */
const S = { profile:{weights:[], goals:[], bwGoal:{kg:'', date:''}, updated:0}, logs:new Map(), lgS:0, programs:new Map(), curId:null, wk:0, view:'week', custom:[], db:null, dl:null, mode:'local' };
const byName = new Map();
function reindex(){
  byName.clear();
  for (const e of DATA.lib) byName.set(norm(e.name), e);
  for (const e of S.custom) byName.set(norm(e.name), {...e, custom:true});
  const opts = [...DATA.lib, ...S.custom].map(e => `<option value="${esc(e.name)}">N${e.lvl} · ${esc(e.cat||'Perso')}</option>`);
  $('#exlist').innerHTML = opts.join('');
}
const cur = () => S.programs.get(S.curId) || null;
const blankRow = () => ({ex:'', sets:'', reps:'', load:''});
const newSession = n => ({id:uid(), name:n, rows:[blankRow(), blankRow(), blankRow()]});
const newProgram = () => ({id:uid(), name:'Nouveau programme', coef:0.5, created:Date.now(), updated:Date.now(),
  weeks:[{id:uid(), cycle:'Bloc 1', sessions:[newSession('Séance A'), newSession('Séance B')]}]});

/* ---------- persistance ---------- */
const LS = 'planif-muscu-v1';
function saveLocal(){ try{ localStorage.setItem(LS, JSON.stringify({programs:[...S.programs.values()], custom:S.custom, curId:S.curId, logs:[...S.logs.entries()], profile:S.profile})); }catch(e){} }
function loadLocal(){ try{ const d = JSON.parse(localStorage.getItem(LS)||'null'); if(!d) return;
  (d.programs||[]).forEach(p => S.programs.set(p.id, p)); S.custom = d.custom||[]; S.curId = d.curId; S.logs = new Map(d.logs||[]); if (d.profile) S.profile = d.profile; }catch(e){} }
function rememberCur(){ try{ localStorage.setItem(LS+'-cur', S.curId||''); }catch(e){} }
function lastCur(){ try{ return localStorage.getItem(LS+'-cur'); }catch(e){ return null; } }

const pendLogs = new Set();
const pending = new Set(); let timer = null, saving = false, customDirty = false, profileDirty = false;
function setStatus(t, err){ const el = $('#status'); el.textContent = t; el.classList.toggle('err', !!err); }
function touch(){ const p = cur(); if(!p) return; p.updated = Date.now(); pending.add(p.id); schedule(); }
function schedule(){ if (!S.db) saveLocal(); setStatus('Modifications en cours…'); clearTimeout(timer); timer = setTimeout(flush, 700); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && (pending.size || pendLogs.size || customDirty || profileDirty)){ clearTimeout(timer); flush(); } });
window.addEventListener('pagehide', () => { if (!S.db) saveLocal(); });
async function flush(){
  if (saving){ timer = setTimeout(flush, 400); return; }
  saving = true; const ids = [...pending]; pending.clear(); const lids = [...pendLogs]; pendLogs.clear(); const cust = customDirty; customDirty = false; const prof = profileDirty; profileDirty = false;
  try{
    if (S.db){
      for (const id of ids){ const p = S.programs.get(id); if (p) await S.db.collection('programs').doc(id).set(clone(p)); }
      if (cust) await S.db.doc('settings/custom').set({items:clone(S.custom)});
      if (prof) await S.db.doc('settings/profile').set(clone(S.profile));
      for (const id of lids){ const l = S.logs.get(id); if (l) await S.db.collection('logs').doc(id).set(clone(l)); }
    }
    saveLocal();
    setStatus(S.db ? 'Enregistré' : LOCAL_TXT);
  }catch(e){
    ids.forEach(i => pending.add(i)); lids.forEach(i => pendLogs.add(i)); if (cust) customDirty = true; if (prof) profileDirty = true;
    setStatus(e && e.code === 'not_granted' ? 'Lecture seule : vous ne pouvez pas modifier ce programme' :
      e && e.code === 'quota_exceeded' ? 'Stockage plein : supprimez d\'anciens programmes' : 'Échec de l\'enregistrement, nouvel essai…', true);
    if (!(e && (e.code === 'not_granted' || e.code === 'quota_exceeded'))) timer = setTimeout(flush, 3000);
  }finally{ saving = false; }
}

async function init(){
  reindex();
  let db = null;
  try{ db = window.claude && window.claude.use ? await window.claude.use('db') : null; }catch(e){ db = null; }
  try{ S.dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null; }catch(e){ S.dl = null; }
  if (location.hash === '#seance') S.view = 'log';
  if (!db){ S.mode = 'local'; loadLocal(); reindex(); pickCur(); setStatus(LOCAL_TXT); renderAll(); return; }
  S.db = db; S.mode = 'db';
  let first = true;
  db.collection('programs').onSnapshot(snap => {
    let changed = false;
    const seen = new Set();
    for (const d of snap.docs){
      seen.add(d.id);
      if (pending.has(d.id)) continue;
      const data = d.data(); const old = S.programs.get(d.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(data)){ S.programs.set(d.id, clone(data)); changed = true; }
    }
    for (const id of [...S.programs.keys()]) if (!seen.has(id) && !pending.has(id)){ S.programs.delete(id); changed = true; }
    if (first || changed){ first = false; pickCur(); if (!document.activeElement || !document.activeElement.closest('#main, header')) renderAll(); else renderTabsAndAside(); }
    if (!pending.size && !saving) setStatus('Enregistré');
  }, e => setStatus('Connexion au stockage perdue : rechargez la page', true));
  db.collection('logs').onSnapshot(snap => {
    let changed = false;
    for (const d of snap.docs){ if (pendLogs.has(d.id)) continue; const data = d.data(); const old = S.logs.get(d.id);
      if (!old || JSON.stringify(old) !== JSON.stringify(data)){ S.logs.set(d.id, clone(data)); changed = true; } }
    if (changed && S.view === 'log' && !(document.activeElement && document.activeElement.closest('#main'))) renderMain();
  }, () => {});
  db.doc('settings/profile').onSnapshot(snap => {
    if (profileDirty || !snap.exists) return; const d = snap.data();
    if (JSON.stringify(d) !== JSON.stringify(S.profile)){ S.profile = clone(d); if (S.view === 'stats' && !(document.activeElement && document.activeElement.closest('#main'))) renderMain(); }
  }, () => {});
  db.doc('settings/custom').onSnapshot(snap => {
    if (customDirty) return;
    const items = snap.exists ? (snap.data().items||[]) : [];
    if (JSON.stringify(items) !== JSON.stringify(S.custom)){ S.custom = clone(items); reindex(); renderCustom(); renderRowsMeta(); renderAside(); }
  }, () => {});
}
function pickCur(){
  if (S.curId && S.programs.has(S.curId)) return;
  const l = lastCur();
  if (l && S.programs.has(l)){ S.curId = l; return; }
  const list = [...S.programs.values()].sort((a,b) => (b.updated||0)-(a.updated||0));
  S.curId = list[0] ? list[0].id : null; S.wk = 0;
}

/* ---------- calculs ---------- */
function rowCalc(r){
  const e = byName.get(norm(r.ex)); const sets = num(r.sets), reps = num(r.reps), load = num(r.load);
  return {e, sets, reps, load, ton: sets*reps*load};
}
function weekCalc(w, coef){
  const m = {}; GROUPS.forEach(g => m[g] = {sets:0, ton:0, p:0});
  const lv = {1:0,2:0,3:0}; let sets = 0, ton = 0, unknown = 0, exCount = 0;
  for (const s of w.sessions) for (const r of s.rows){
    const c = rowCalc(r); if (!c.sets) continue;
    exCount++; sets += c.sets; ton += c.ton;
    if (!c.e){ unknown += c.sets; continue; }
    lv[c.e.lvl] += c.sets;
    c.e.p.forEach(g => { m[g].sets += c.sets; m[g].ton += c.ton; m[g].p += c.sets; });
    c.e.s.forEach(g => { if (!m[g]) return; m[g].sets += c.sets*coef; m[g].ton += c.ton*coef; });
  }
  return {m, lv, sets, ton, unknown, exCount};
}

/* ---------- rendu ---------- */
function renderAll(){ renderHeader(); renderTabs(); renderMain(); renderAside(); renderCustom(); }
function renderTabsAndAside(){ renderHeader(); renderTabs(); renderAside(); }

function renderHeader(){
  const list = [...S.programs.values()].sort((a,b) => String(a.name).localeCompare(String(b.name), 'fr'));
  $('#progSel').innerHTML = list.length ? list.map(p => `<option value="${p.id}" ${p.id===S.curId?'selected':''}>${esc(p.name||'Sans nom')}</option>`).join('') : '<option>Aucun programme</option>';
  $('#progSel').disabled = !list.length;
  const p = cur();
  const nameEl = $('#progName');
  if (document.activeElement !== nameEl) nameEl.value = p ? p.name : '';
  nameEl.disabled = $('#dupProg').disabled = $('#delProg').disabled = !p;
}

function renderTabs(){
  const p = cur(); const bar = $('#weekbar');
  if (!p){ bar.innerHTML = ''; return; }
  if (S.wk >= p.weeks.length) S.wk = p.weeks.length - 1;
  const groups = [];
  p.weeks.forEach((w, i) => {
    const last = groups[groups.length-1];
    if (last && last.cycle === (w.cycle||'')) last.idx.push(i); else groups.push({cycle:w.cycle||'', idx:[i]});
  });
  bar.innerHTML = `<div class="tabs" role="tablist">
      <div class="cgroup"><div class="clabel">Préparation</div><div class="ctabs"><button class="tab cycle" role="tab" data-view="plan" aria-selected="${S.view==='plan'}">Plan de volume</button></div></div>
      <div class="cgroup"><div class="clabel">À la salle</div><div class="ctabs"><button class="tab cycle" role="tab" data-view="log" aria-selected="${S.view==='log'}">Mode séance</button><button class="tab cycle" role="tab" data-view="stats" aria-selected="${S.view==='stats'}">Suivi</button></div></div>
      ${groups.map(g => `
      <div class="cgroup"><div class="clabel" title="${esc(g.cycle)}">${esc(g.cycle||'Sans cycle')}</div>
      <div class="ctabs">${g.idx.map(i => `<button class="tab${isDeload(p.weeks[i]) ? ' dl' : ''}" role="tab" data-wk="${i}" aria-selected="${S.view==='week'&&S.wk===i}" title="${isDeload(p.weeks[i]) ? 'Semaine de décharge' : ''}">S${i+1}${isDeload(p.weeks[i]) ? '<small>↓</small>' : ''}</button>`).join('')}</div></div>`).join('')}
      <div class="cgroup"><div class="clabel">Synthèse</div><div class="ctabs"><button class="tab cycle" role="tab" data-view="cycle" aria-selected="${S.view==='cycle'}">Vue programme</button></div></div>
    </div>
    <div class="weekactions">
      <label for="pct">Progression charge</label><input id="pct" class="num" type="number" step="0.5" value="${esc(S.pct ?? 0)}" aria-label="Progression de charge en %"><span class="note">%</span>
      <button id="addWeek" class="primary">+ Semaine à la fin (copie de S${p.weeks.length})</button>
    </div>`;
}

function rowHtml(si, ri, r){
  const c = rowCalc(r);
  const lv = c.e ? `<span class="lvl l${c.e.lvl}" title="Niveau ${c.e.lvl} – ${LVL_TXT[c.e.lvl]}">${c.e.lvl}</span>`
    : (r.ex ? `<span class="lvl lx" title="Hors bibliothèque : aucun muscle compté">?</span>` : `<span class="lvl l3">–</span>`);
  return `<tr data-s="${si}" data-r="${ri}">
    <td class="c-ex"><div class="exin"><input list="exlist" data-f="ex" value="${esc(r.ex)}" placeholder="Saisir ou parcourir" aria-label="Exercice"><button class="browse" data-act="pickRow" aria-label="Parcourir la bibliothèque">Parcourir</button></div></td>
    <td class="c-lv">${lv}</td>
    <td><input class="n" data-f="sets" inputmode="decimal" value="${esc(r.sets)}" aria-label="Séries"></td>
    <td><input class="n" data-f="reps" inputmode="decimal" value="${esc(r.reps)}" aria-label="Répétitions"></td>
    <td><input class="n" data-f="load" inputmode="decimal" value="${esc(r.load)}" aria-label="Charge en kg"></td>

    <td><button class="ghost" data-act="delRow" aria-label="Supprimer la ligne">✕</button></td></tr>`;
}
function sessFoot(s){
  let sets = 0, ton = 0; s.rows.forEach(r => { const c = rowCalc(r); sets += c.sets; ton += c.ton; });
  return `<span>${fmt(sets,1)} séries · ${fmtT(ton)}</span>`;
}

        <button data-wkins="0">avant S${S.wk+1}</button><button data-wkins="1">après S${S.wk+1}</button></div>
      <div class="grp"><button class="danger" id="delWeek" ${p.weeks.length<2?'disabled':''}>Supprimer S${S.wk+1}</button></div>

function renderRowsMeta(){ // met à jour niveaux + tonnages sans reconstruire les champs

function musContribs(g, w, coef){
  const out = [];
  w.sessions.forEach((s, si) => s.rows.forEach((r, ri) => {
    const c = rowCalc(r); if (!c.e || !c.sets) return;
    const role = c.e.p.includes(g) ? 'P' : c.e.s.includes(g) ? 'S' : ''; if (!role) return;
    out.push({si, ri, s, r, e:c.e, role, eff: role === 'P' ? c.sets : c.sets*coef});
  }));
  return out.sort((a,b) => b.eff - a.eff);
}
function musSuggest(g, w){
  const inWeek = new Set(w.sessions.flatMap(s => s.rows.map(r => norm(r.ex))));
  return allEx().filter(e => e.p.includes(g) && !inWeek.has(norm(e.name)))
    .sort((a,b) => (a.p.length - b.p.length) || (b.lvl - a.lvl)).slice(0, 5);
}
function musDetail(g, p, coef){
  const w = p.weeks[S.wk];
  if (S.musSess == null || S.musSess >= w.sessions.length) S.musSess = 0;
  const cs = musContribs(g, w, coef), sg = musSuggest(g, w);
  const sessSel = w.sessions.length ? `<select id="musSess" aria-label="Séance où ajouter">${w.sessions.map((s,i) => `<option value="${i}" ${i===S.musSess?'selected':''}>${esc(s.name)}</option>`).join('')}</select>` : '';
  return `<div class="blk"><h4>Solliciter ${esc(g)}</h4>
      ${w.sessions.length ? `<div class="line"><span class="note">Ajouter dans</span>${sessSel}</div>
      ${sg.length ? `<div class="sugg">${sg.map(e => `<button data-addex="${esc(e.name)}" title="${esc(e.p.join(', '))}${e.s.length?' · '+esc(e.s.join(', ')):''}"><span class="lvl l${e.lvl}" style="width:18px;height:16px;font-size:10px">${e.lvl}</span> ${esc(e.name)}</button>`).join('')}</div>` : ''}
      <div class="line"><button data-pickmus="${esc(g)}">Parcourir tous les exercices qui ciblent ${esc(g)}</button></div>`
      : `<p class="note">Ajoutez d'abord une séance.</p>`}
    </div>
    <div class="blk"><h4>Décharger ${esc(g)}</h4>
      ${cs.length ? `<div class="contrib">${cs.map(c => `<div class="who"><span class="role ${c.role}" title="${c.role==='P'?'Muscle principal':'Muscle secondaire'}">${c.role}</span>${esc(c.r.ex)}<small>${esc(c.s.name)} · ${esc(c.r.sets)} séries → ${fmt(c.eff,1)} pour ${esc(g)}</small></div>
        <div class="acts"><button data-dec="${c.si}:${c.ri}" title="Retirer une série">−1 série</button><button data-swap="${c.si}:${c.ri}" title="Remplacer par un exercice du même groupe qui épargne ${esc(g)}">Remplacer</button><button class="danger" data-rm="${c.si}:${c.ri}">Retirer</button></div>`).join('')}</div>`
      : `<p class="note">Aucun exercice de la semaine ne sollicite ce muscle.</p>`}
    </div>`;
}
function snapshotUndo(label){ const p = cur(); S.undo = {pid:p.id, wk:S.wk, week:clone(p.weeks[S.wk]), label}; }

function renderAside(){
  const p = cur(); const a = $('#aside');
  if (!p){ a.innerHTML = `<h3>Bilan</h3><p class="note">Le bilan des séries et du tonnage par muscle s'affiche ici dès qu'une séance contient des exercices.</p>`; return; }
  a.hidden = S.view === 'log' || S.view === 'stats'; if (a.hidden) return;
  const coef = p.coef ?? 0.5;
  if (S.view === 'plan'){ a.innerHTML = planAsideHtml(p, coef); return; }
  const isWeek = S.view === 'week';
  let calc;
  if (isWeek) calc = weekCalc(p.weeks[S.wk], coef);
  else { // moyenne hebdo sur le programme
    const all = p.weeks.map(w => weekCalc(w, coef)); const n = all.length || 1;
    calc = {m:{}, lv:{1:0,2:0,3:0}, sets:0, ton:0, unknown:0, exCount:0};
    GROUPS.forEach(g => calc.m[g] = {sets:0, ton:0, p:0});
    all.forEach(c => { GROUPS.forEach(g => { calc.m[g].sets += c.m[g].sets/n; calc.m[g].ton += c.m[g].ton/n; calc.m[g].p += c.m[g].p/n; });
      [1,2,3].forEach(l => calc.lv[l] += c.lv[l]/n); calc.sets += c.sets/n; calc.ton += c.ton/n; calc.unknown += c.unknown/n; calc.exCount += c.exCount; });
  }
  const rows = GROUPS.map(g => ({g, ...calc.m[g]})).filter(x => x.sets > 0).sort((a,b) => b.sets - a.sets);
  const max = Math.max(1, ...rows.map(x => x.sets));
  const none = GROUPS.filter(g => !(calc.m[g].sets > 0));
  a.innerHTML = `
    <h3>${isWeek ? `Bilan S${S.wk+1}` : 'Moyenne par semaine'}</h3>
    ${S.undo && S.undo.pid === p.id ? `<div class="undo"><span>${esc(S.undo.label)}</span><button id="undoBtn">Annuler</button></div>` : ''}
    ${isWeek && calc.exCount ? `<p class="note">Cliquez sur un muscle pour le solliciter davantage ou le décharger.</p>` : ''}
    <div class="kpis">
      <div class="kpi"><b>${fmt(calc.sets,1)}</b><span>Séries</span></div>
      <div class="kpi"><b>${fmtT(calc.ton)}</b><span>Tonnage</span></div>
    </div>
    <div class="lvlrow">${[1,2,3].map(l => `<span class="lvlpill"><span class="lvl l${l}">${l}</span>${fmt(calc.lv[l],1)} séries</span>`).join('')}</div>
    ${calc.exCount ? `<div class="tablebox"><table class="mus">
      <thead><tr><th>Muscle</th><th></th><th>Séries</th><th>Tonnage</th></tr></thead>
      <tbody>${rows.map(x => `<tr class="${S.openMus===x.g?'open':''}"><td><button class="mname" data-mus="${esc(x.g)}" aria-expanded="${S.openMus===x.g}">${esc(x.g)}</button></td>
        <td class="bar"><div style="display:flex"><i style="width:${x.p/max*100}%"></i><i class="sec" style="width:${(x.sets-x.p)/max*100}%"></i></div></td>
        <td class="num">${fmt(x.sets,1)}</td><td class="num">${fmtT(x.ton)}</td></tr>${isWeek && S.openMus===x.g ? `<tr><td colspan="4" class="mdet">${musDetail(x.g, p, coef)}</td></tr>` : ''}`).join('')}</tbody></table></div>
      ${none.length ? `<div class="nonelist note"><b>Non sollicités :</b> ${none.map(g => isWeek ? `<button data-mus="${esc(g)}" title="Solliciter ce muscle">+ ${esc(g)}</button>` : esc(g)).join(' ')}</div>
        ${isWeek && none.includes(S.openMus) ? `<div class="mdet" style="border-radius:8px;padding:8px">${musDetail(S.openMus, p, coef)}</div>` : ''}` : ''}
      ${calc.unknown ? `<p class="note" style="color:var(--danger)">${fmt(calc.unknown,1)} séries d'exercices hors bibliothèque ne sont comptées dans aucun muscle.</p>` : ''}`
    : `<p class="note idle">Saisissez au moins un exercice avec un nombre de séries pour voir la répartition par muscle.</p>`}
    <div class="coef"><label for="coefIn">Coefficient muscles secondaires</label><input id="coefIn" class="num" type="number" min="0" max="1" step="0.1" value="${coef}"></div>
    <p class="note">Bleu : séries où le muscle est principal (1 série = 1). Doré : part secondaire (1 série = coefficient). Tonnage = séries × reps × charge, réparti avec la même pondération.</p>
    <div class="line" style="display:flex;gap:6px;flex-wrap:wrap"><button id="exportBtn">Exporter le programme (CSV)</button><button id="exportLogs">Exporter les séances réalisées (CSV)</button></div>`;
}

function cycleHtml(p){
  const coef = p.coef ?? 0.5;
  const calcs = p.weeks.map(w => weekCalc(w, coef));
  const used = GROUPS.filter(g => calcs.some(c => c.m[g].sets > 0));
  const max = Math.max(1, ...calcs.flatMap(c => used.map(g => c.m[g].sets)));
  const groups = []; p.weeks.forEach((w,i) => { const l = groups[groups.length-1]; if (l && l.cycle === (w.cycle||'')) l.n++; else groups.push({cycle:w.cycle||'Sans cycle', n:1}); });
  const cell = v => `<td class="num" style="background:color-mix(in srgb, var(--accent) ${Math.round(v/max*55)}%, transparent)">${v ? fmt(v,1) : '·'}</td>`;
  if (!used.length) return `<div class="empty"><h3>Vue programme</h3><p class="note">Ajoutez des exercices avec des séries pour voir l'évolution des séries par muscle sur toutes les semaines.</p></div>`;
  return `<div class="weekhead"><h2>Vue programme</h2><span class="note">Séries pondérées par muscle et par semaine</span></div>
  <div class="cyclebox"><table class="matrix">
    <thead><tr><th></th>${groups.map(g => `<th class="cyc" colspan="${g.n}">${esc(g.cycle)}</th>`).join('')}<th></th></tr>
      <tr><th>Muscle</th>${p.weeks.map((w,i) => `<th>S${i+1}</th>`).join('')}<th>Moy.</th></tr></thead>
    <tbody>${used.map(g => `<tr><td>${esc(g)}</td>${calcs.map(c => cell(c.m[g].sets)).join('')}<td class="num">${fmt(calcs.reduce((s,c)=>s+c.m[g].sets,0)/calcs.length,1)}</td></tr>`).join('')}</tbody>
    <tfoot>
      <tr><td>Séries totales</td>${calcs.map(c => `<td class="num">${fmt(c.sets,1)}</td>`).join('')}<td class="num">${fmt(calcs.reduce((s,c)=>s+c.sets,0)/calcs.length,1)}</td></tr>
      ${[1,2,3].map(l => `<tr><td>Séries niveau ${l}</td>${calcs.map(c => `<td class="num">${fmt(c.lv[l],1)}</td>`).join('')}<td class="num">${fmt(calcs.reduce((s,c)=>s+c.lv[l],0)/calcs.length,1)}</td></tr>`).join('')}
      <tr><td>Tonnage</td>${calcs.map(c => `<td class="num">${fmtT(c.ton)}</td>`).join('')}<td class="num">${fmtT(calcs.reduce((s,c)=>s+c.ton,0)/calcs.length)}</td></tr>
    </tfoot></table></div>`;
}

function renderCustom(){
  const chips = (cls) => GROUPS.map(g => `<button class="chip ${cls}" aria-pressed="false" data-g="${esc(g)}">${esc(g)}</button>`).join('');
  if (!$('#cP').children.length){ $('#cP').innerHTML = chips('p'); $('#cS').innerHTML = chips('s'); }
  $('#cList').innerHTML = S.custom.length ? '<b>Vos exercices ajoutés</b>' + S.custom.map((e,i) => `<div><span class="lvl l${e.lvl}">${e.lvl}</span>${esc(e.name)} — ${esc(e.p.join(', '))}${e.s.length ? ' / ' + esc(e.s.join(', ')) : ''}<button class="ghost danger" data-cdel="${i}">Retirer</button></div>`).join('') : '';
}

/* ---------- actions ---------- */
function armConfirm(btn, label, fn){
  if (btn.dataset.armed){ delete btn.dataset.armed; fn(); return; }
  const old = btn.textContent; btn.dataset.armed = '1'; btn.textContent = label; btn.classList.add('confirm');
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed){ delete btn.dataset.armed; btn.textContent = old; btn.classList.remove('confirm'); } }, 3500);
}
function addProgram(p){ S.programs.set(p.id, p); S.curId = p.id; S.wk = 0; S.view = 'week'; rememberCur(); pending.add(p.id); schedule(); renderAll(); }
const isDeload = w => w.deload != null ? !!w.deload : /d[ée]charge|deload/i.test(w.cycle || '');
function copyWeek(w, pct){
  const f = 1 + (num(pct)/100);
  const c = clone(w); c.id = uid();
  c.sessions.forEach(s => { s.id = uid(); s.rows.forEach(r => { r.id = uid(); if (f !== 1 && num(r.load)) r.load = String(Math.round(num(r.load)*f*2)/2); }); });
  return c;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  const p = cur();
  if (t.id === 'newProg' || t.dataset.act === 'newProg') return addProgram(newProgram());
  if (t.id === 'dupProg' && p){ const c = clone(p); c.id = uid(); c.name = p.name + ' (copie)'; c.created = c.updated = Date.now(); return addProgram(c); }
  if (t.id === 'delProg' && p) return armConfirm(t, 'Confirmer la suppression', async () => {
    S.programs.delete(p.id); pending.delete(p.id); S.curId = null; pickCur(); rememberCur(); renderAll(); saveLocal();
    try{ if (S.db) await S.db.collection('programs').doc(p.id).delete(); setStatus('Programme supprimé'); }catch(err){ setStatus('Suppression impossible', true); }
  });
  if (t.dataset.wk !== undefined){ S.view = 'week'; S.wk = +t.dataset.wk; renderTabs(); renderMain(); renderAside(); return; }
  if (t.dataset.view){ S.view = t.dataset.view; renderTabs(); renderMain(); renderAside(); if (S.view === 'stats' || S.view === 'log') window.scrollTo(0, 0); return; }
  if (t.dataset.stex !== undefined){ ST.ex = t.dataset.stex; saveST(); renderMain(); return; }
  if (S.view === 'stats' && goalsClick(t)) return;
  if (!p) return;
  if (t.id === 'addWeek'){ p.weeks.push(copyWeek(p.weeks[p.weeks.length-1], S.pct)); S.wk = p.weeks.length-1; S.view='week'; touch(); renderAll(); return; }
  if (t.dataset.wkmove !== undefined){ const j = S.wk + +t.dataset.wkmove; if (j < 0 || j >= p.weeks.length) return;
    [p.weeks[S.wk], p.weeks[j]] = [p.weeks[j], p.weeks[S.wk]]; S.wk = j; touch(); renderAll(); setStatus(`Semaine déplacée en S${j+1}`); return; }
  if (t.dataset.wkins !== undefined){ const src = p.weeks[S.wk]; const mode = S.insMode || 'copy'; let nw;
    if (mode === 'empty'){ nw = {id:uid(), cycle:src.cycle, sessions: src.sessions.map(s => ({id:uid(), name:s.name, rows:[]}))}; }
    else { nw = copyWeek(src, 0); nw.sessions.forEach(s => s.rows.forEach(r => { r.id = uid(); if (mode === 'deload' && num(r.sets)) r.sets = String(Math.max(1, Math.ceil(num(r.sets)/2))); })); }
    if (mode === 'deload'){ nw.deload = true; } else delete nw.deload;
    const at = S.wk + +t.dataset.wkins; p.weeks.splice(at, 0, nw); S.wk = at; touch(); renderAll(); setStatus(`Semaine insérée en S${at+1}`); return; }
  if (t.id === 'delWeek') return armConfirm(t, `Confirmer : supprimer S${S.wk+1}`, () => { p.weeks.splice(S.wk, 1); S.wk = Math.max(0, S.wk-1); touch(); renderAll(); });
  if (t.id === 'exportBtn') return exportCsv(p);
  if (t.id === 'exportLogs') return exportLogsCsv(null);
  if (t.id === 'undoBtn' && S.undo && S.undo.all){ const u = S.undo; const tp = S.programs.get(u.pid); if (tp){ tp.weeks = u.weeks; if (u.plan) tp.plan = u.plan; touch(); } S.undo = null; renderAll(); return; }
  if (S.view === 'plan' && planClick(t, p)) return;
  if (S.view === 'log' && logClick(t, p)) return;
  if (t.id === 'undoBtn' && S.undo){ const u = S.undo; const tp = S.programs.get(u.pid); if (tp && tp.weeks[u.wk] && tp.weeks[u.wk].id === u.week.id){ tp.weeks[u.wk] = u.week; S.wk = u.wk; S.view = 'week'; touch(); } S.undo = null; renderAll(); return; }
  if (t.dataset.mus !== undefined){ S.openMus = S.openMus === t.dataset.mus ? null : t.dataset.mus; renderAside(); return; }
  if (t.dataset.addex !== undefined){ const s = p.weeks[S.wk].sessions[S.musSess||0]; if (!s) return;
    snapshotUndo(`« ${t.dataset.addex} » ajouté à ${s.name}`);
    let r = s.rows.find(x => !x.ex && !x.sets); if (!r){ r = blankRow(); s.rows.push(r); } r.ex = t.dataset.addex; r.sets = r.sets || '3';
    touch(); renderMain(); renderAside(); return; }
  if (t.dataset.pickmus !== undefined) return openPicker(S.musSess||0, null, {mus:t.dataset.pickmus});
  const ref = t.dataset.dec || t.dataset.rm || t.dataset.swap;
  if (ref){ const [a, b] = ref.split(':').map(Number); const s = p.weeks[S.wk].sessions[a]; const r = s && s.rows[b]; if (!r) return;
    if (t.dataset.swap){ const e = byName.get(norm(r.ex)); return openPicker(a, b, {cat:e ? e.cat : '', excl:S.openMus}); }
    if (t.dataset.dec){ const n = num(r.sets); if (n <= 1) { snapshotUndo(`« ${r.ex} » retiré de ${s.name}`); s.rows.splice(b, 1); } else { snapshotUndo(`${r.ex} : ${n} → ${n-1} séries`); r.sets = String(n-1); } }
    else { snapshotUndo(`« ${r.ex} » retiré de ${s.name}`); s.rows.splice(b, 1); }
    touch(); renderMain(); renderAside(); return; }
  const w = p.weeks[S.wk]; const sec = t.closest('[data-s]'); const si = sec ? +sec.dataset.s : -1;
  if (t.dataset.act === 'addSess'){ w.sessions.push(newSession('Séance ' + String.fromCharCode(65 + w.sessions.length))); touch(); renderMain(); renderAside(); return; }
  if (t.dataset.act === 'delSess') return armConfirm(t, 'Confirmer', () => { w.sessions.splice(si, 1); touch(); renderMain(); renderAside(); });

const today = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
function logKey(p, w, s){ return (p.id + '__' + w.id + '__' + s.id).slice(0, 190); }
/* RPE par série (repli : RPE d'exercice des anciennes saisies) et 3RM estimé */
const RPE_OPTS = ['5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10'];
const setRpe = (x, l, id) => num(x && x.e) || num(l && l.rpe && l.rpe[id]) || null;
const rirOf = rpe => rpe ? Math.max(0, 10 - rpe) : null;
const RM_MAX_REPS = 12;       // reps réellement faites, au-delà l'estimation n'est plus fiable
const RM_MAX_EFF = 15;        // reps + réserve
const RIR_MAX = 4;            // au-delà de 4 reps en réserve, l'auto-estimation n'est plus fiable
const REF_REPS = 3;           // on travaille en 3RM : charge maximale pour 3 reps à l'échec
const epley = (load, reps) => reps <= 1 ? load : load * (1 + reps/30);
/* 3RM estimé = 1RM d'Epley ramené à 3 reps : 1RM / (1 + 3/30) ; une série de 3 reps à l'échec donne exactement sa charge */
const est3 = (load, reps) => epley(load, reps) / (1 + REF_REPS/30);
/* estimation d'une série : brute (Epley sur les reps faites) et corrigée (Epley sur reps + RIR) */

  const rir = rirOf(rpe); const eff = r + (rir ?? 0);
  const raw = est3(ld, r);
  const cor = (eff <= RM_MAX_EFF && (rir == null || rir <= RIR_MAX)) ? est3(ld, eff) : null;
  return {raw, cor, rir, eff, hasRpe: rpe != null};
}

function exportLogsCsv(keys){

    // si la séance est terminée, le prévu figé au moment de la saisie fait foi
    ens = ens.map(en => { const m = l.meta[en.id]; return (l.finished && m && en.plan) ? {...en, plan:{ex:m.planEx, sets:m.sets, reps:m.reps, load:m.load}} : en; });
    const any = ens.some(en => (l.sets[en.id] || []).some(x => x.d || x.r || x.l)); if (!any && !l.finished) continue;

          did ? dec(Math.round(num(rr)*num(ll)*10)/10) : '', ...(() => { const rp = setRpe(x, l, en.id); const est = did ? estRM(num(rr), num(ll), rp) : null;
            const r1 = v => v != null ? dec(Math.round(v*10)/10) : '';
            return [dec(rp ?? ''), rp != null ? dec(rirOf(rp)) : '', est ? r1(est.raw) : '', est ? r1(est.cor) : '']; })(), e ? e.lvl : '', e ? e.p.join(', ') : '', e ? e.s.join(', ') : '',

/* ---------- suivi / progression ---------- */
const REP_SEC = 4;            // durée d'une répétition (s), hypothèse utilisateur
const ST = {prog:'all', ex:'', per:'all', method:'ts', nodl:false, rm:'rir'};
try{ Object.assign(ST, JSON.parse(localStorage.getItem(LS+'-stats')||'{}')); }catch(e){}
const saveST = () => { try{ localStorage.setItem(LS+'-stats', JSON.stringify(ST)); }catch(e){} };
const ddmm = d => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d||''); return m ? `${m[3]}/${m[2]}` : (d||'?'); };

function resolveLog(l0){
  const p = S.programs.get(l0.pid); const wi = p ? p.weeks.findIndex(x => x.id === l0.wid) : -1;
  const w = wi >= 0 ? p.weeks[wi] : null; const s = w ? w.sessions.find(x => x.id === l0.sid) : null;
  const l = {...l0, sets:l0.sets||{}, rpe:l0.rpe||{}, sub:l0.sub||{}, extra:l0.extra||[], meta:l0.meta||{}};
  let ens = s ? logEntries(s, l) : [];
  const seen = new Set(ens.map(e => e.id));
  Object.keys(l.meta).forEach(id => { if (seen.has(id)) return; const m = l.meta[id];
    ens.push({id, ex:m.ex, planEx:m.planEx, kind:m.kind, plan: m.kind === 'Ajouté' ? null : {ex:m.planEx, sets:m.sets, reps:m.reps, load:m.load}}); });
  ens = ens.map(en => { const m = l.meta[en.id]; return (m && en.plan) ? {...en, plan:{ex:m.planEx, sets:m.sets, reps:m.reps, load:m.load}} : en; });
  return {p, wi, w, s, l, ens};
}
function collectSessions(){
  const out = [];
  const minDate = ST.per === 'all' ? '' : (() => { const d = new Date(); d.setDate(d.getDate() - +ST.per); return d.toISOString().slice(0,10); })();
  for (const [k, l0] of S.logs){
    if (!l0 || !l0.finished) continue;
    if (ST.prog !== 'all' && l0.pid !== ST.prog) continue;
    if (minDate && String(l0.date) < minDate) continue;
    const R = resolveLog(l0); const l = R.l;
    if (ST.nodl && R.w && isDeload(R.w)) continue;
    const exs = [];
    for (const en of R.ens){
      const sets = ((l.sets[en.id]) || []).filter(x => x.d).map(x => ({r: num(x.r || (en.plan && en.plan.reps)), l: num(x.l || (en.plan && en.plan.load)), e: setRpe(x, l, en.id)})).filter(x => x.r > 0);
      if (!sets.length) continue;
      let best = null;
      sets.forEach(x => { const est = estRM(x.r, x.l, x.e); if (!est) return;
        const v = ST.rm === 'raw' ? est.raw : (est.cor ?? null); if (v == null) return;
        if (!best || v > best.v) best = {v, r:x.r, l:x.l, rpe:x.e, rir:est.rir, eff:est.eff, raw:est.raw, noRpe: !est.hasRpe}; });
      const reps = sets.reduce((a,x) => a + x.r, 0);
      const rs = sets.filter(x => x.e), rdur = rs.reduce((a,x) => a + x.r*REP_SEC, 0);
      exs.push({name:en.ex, sets, reps, ton: sets.reduce((a,x) => a + x.r*x.l, 0), dur: reps*REP_SEC, rpeSum: rs.reduce((a,x) => a + x.e*x.r*REP_SEC, 0), rdur,
        rpe: rdur ? rs.reduce((a,x) => a + x.e*x.r*REP_SEC, 0)/rdur : null, best});
    }
    if (!exs.length) continue;
    const dur = exs.reduce((a,e) => a + e.dur, 0);
    const wdur = exs.reduce((a,e) => a + e.rdur, 0);
    const rpe = wdur ? exs.reduce((a,e) => a + e.rpeSum, 0) / wdur : null;
    out.push({key:k, date:l.date, name: R.s ? R.s.name : l.session, prog: R.p ? R.p.name : '', week: R.wi >= 0 ? `S${R.wi+1}` : '',
      exs, ton: exs.reduce((a,e) => a + e.ton, 0), dur, rpe, srpe: rpe != null ? rpe * dur/60 : null, rpeCover: dur ? wdur/dur : 0});
  }
  return out.sort((a,b) => String(a.date).localeCompare(String(b.date)) || String(a.name).localeCompare(String(b.name)));
}

/* tendance : pente perf / jour, exprimée en %/semaine de la valeur moyenne */
const DAY = 86400000;
const dayNum = d => { const t = Date.parse(d + 'T12:00:00'); return isFinite(t) ? t / DAY : NaN; };
const median = a => { const b = [...a].sort((x,y) => x-y); const n = b.length; return n ? (n % 2 ? b[(n-1)/2] : (b[n/2-1] + b[n/2]) / 2) : NaN; };
const TREND_MIN_N = 3, TREND_MIN_DAYS = 7;
function fitTrend(pts){
  const P = pts.filter(p => isFinite(p.t) && isFinite(p.v));
  const n = P.length; if (n < TREND_MIN_N) return null;
  const t0 = Math.min(...P.map(p => p.t)), t1 = Math.max(...P.map(p => p.t)); if (t1 - t0 < TREND_MIN_DAYS) return null;
  const mt = P.reduce((a,p) => a + p.t, 0)/n, mv = P.reduce((a,p) => a + p.v, 0)/n; if (!mv) return null;
  let slope, icpt;
  if (ST.method === 'ts'){
    const sl = []; for (let i = 0; i < n; i++) for (let j = i+1; j < n; j++) if (P[j].t !== P[i].t) sl.push((P[j].v - P[i].v)/(P[j].t - P[i].t));
    slope = median(sl); icpt = median(P.map(p => p.v - slope*p.t));
  } else {
    let sxy = 0, sxx = 0; P.forEach(p => { sxy += (p.t - mt)*(p.v - mv); sxx += (p.t - mt)**2; });
    slope = sxx ? sxy/sxx : 0; icpt = mv - slope*mt;
  }
  const ssT = P.reduce((a,p) => a + (p.v - mv)**2, 0), ssR = P.reduce((a,p) => a + (p.v - (icpt + slope*p.t))**2, 0);
  return {slope, icpt, n, t0, t1, perWeek: slope*7, pct: slope*7/mv*100, r2: ssT ? Math.max(0, 1 - ssR/ssT) : 0};
}
function sparkSVG(pts, fit, unit){
  const W = 96, H = 30, pd = 4; if (!pts.length) return '';
  const ts = pts.map(p => p.t), vs = pts.map(p => p.v);
  if (fit){ vs.push(fit.icpt + fit.slope*fit.t0, fit.icpt + fit.slope*fit.t1); }
  const tmin = Math.min(...ts), tmax = Math.max(...ts), vmin = Math.min(...vs), vmax = Math.max(...vs);
  const X = t => pd + (tmax > tmin ? (t - tmin)/(tmax - tmin) : 0.5)*(W - 2*pd), Y = v => H - pd - (vmax > vmin ? (v - vmin)/(vmax - vmin) : 0.5)*(H - 2*pd);
  const L = pts[pts.length-1];
  return `<svg class="spark" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    ${fit ? `<line class="sp-fit" x1="${X(fit.t0)}" y1="${Y(fit.icpt + fit.slope*fit.t0)}" x2="${X(fit.t1)}" y2="${Y(fit.icpt + fit.slope*fit.t1)}"/>` : ''}
    <path class="sp-ln" d="${pts.map((p,i) => `${i?'L':'M'}${X(p.t)},${Y(p.v)}`).join(' ')}"/><circle class="sp-dot" cx="${X(L.t)}" cy="${Y(L.v)}" r="2.5"/></svg>`;
}
const pctTxt = (f, d=1) => f ? `<span class="${f.pct < -0.05 ? 'neg' : f.pct > 0.05 ? 'pos' : 'mini'}">${f.pct > 0 ? '+' : ''}${fmt(f.pct, d)} %/sem</span>` : '<span class="mini">–</span>';
const slopeTxt = (f, unit) => f ? `${pctTxt(f)} <span class="mini">(${f.perWeek > 0 ? '+' : ''}${fmt(f.perWeek, 1)} ${unit}/sem${ST.method === 'ols' ? `, R² ${fmt(f.r2, 2)}` : ''})</span>` : `<span class="mini">tendance non calculée (≥ ${TREND_MIN_N} séances sur ≥ ${TREND_MIN_DAYS} jours)</span>`;
function exSeries(ses){
  const m = new Map();
  ses.forEach(s => { const t = dayNum(s.date); s.exs.forEach(e => {
    const x = m.get(e.name) || {name:e.name, n:0, tonTot:0, rm:[], ton:[], best:null};
    x.n++; x.tonTot += e.ton; x.ton.push({t, v:e.ton, s});
    if (e.best){ x.rm.push({t, v:e.best.v, s, b:e.best}); if (!x.best || e.best.v > x.best.v) x.best = {...e.best, date:s.date}; }
    m.set(e.name, x); }); });
  m.forEach(x => { x.fRm = fitTrend(x.rm); x.fTon = fitTrend(x.ton.filter(p => p.v > 0)); });
  return m;
}
function rankList(items, key, unit, dir){
  if (!items.length) return `<p class="note">Pas assez de données : il faut au moins ${TREND_MIN_N} séances sur ${TREND_MIN_DAYS} jours ou plus pour un même mouvement.</p>`;
  return `<ol class="rank">${items.map((x, i) => { const f = x[key]; const pts = key === 'fRm' ? x.rm : x.ton.filter(p => p.v > 0);
    return `<li><span class="rk">${i+1}.</span><div class="rkname"><button class="mname" data-stex="${esc(x.name)}">${esc(x.name)}</button><small>${f.n} séances · ${f.perWeek > 0 ? '+' : ''}${fmt(f.perWeek, 1)} ${unit}/sem</small></div>
      ${sparkSVG(pts, f)}<span class="rkv">${pctTxt(f)}</span></li>`; }).join('')}</ol>`;
}
function topFlop(series, key, unit, title){

/* 3RM de référence : meilleure estimation des 28 jours précédant la dernière séance du mouvement */
function currentRM(series){
  if (!series || !series.rm.length) return null;
  const tLast = Math.max(...series.rm.map(p => p.t));
  const win = series.rm.filter(p => p.t >= tLast - 28);
  const b = win.reduce((a, p) => !a || p.v > a.v ? p : a, null);
  return {v:b.v, date:b.s.date, b:b.b};

/* graphiques SVG (une série, une échelle, survol) */
function niceStep(r){ const e = Math.pow(10, Math.floor(Math.log10(r || 1))); const f = r/e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * e; }
function drawChart(el, pts, o){
  const W = Math.max(280, el.clientWidth), H = o.h || 210, m = {l:46, r:14, t:14, b:30};
  const pw = W - m.l - m.r, ph = H - m.t - m.b, n = pts.length;
  const vals = pts.map(p => p.v);
  if (o.target) vals.push(o.target.v);
  if (o.fit){ const T = pts.map(p => p.t); vals.push(o.fit.icpt + o.fit.slope*Math.min(...T), o.fit.icpt + o.fit.slope*Math.max(...T)); }
  let lo = o.fixed ? o.fixed[0] : (o.zero ? 0 : Math.min(...vals)), hi = o.fixed ? o.fixed[1] : Math.max(...vals);
  if (!o.fixed){ if (hi === lo){ hi += hi ? hi*0.1 : 1; lo = o.zero ? 0 : Math.max(0, lo - (lo*0.1 || 1)); } const pad = (hi - lo)*0.08; hi += pad; if (!o.zero) lo = Math.max(0, lo - pad); }
  const step = o.step || niceStep((hi - lo)/4); lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step;
  const y = v => m.t + ph - (v - lo)/(hi - lo || 1)*ph;
  const band = pw / n; let x = i => m.l + band*(i + 0.5);
  const timed = o.time && n > 1;
  if (timed){ const T = pts.map(p => p.t), tmin = Math.min(...T), tmax = Math.max(...T), ip = 14;
    x = i => m.l + ip + (tmax > tmin ? (pts[i].t - tmin)/(tmax - tmin) : 0.5)*(pw - 2*ip); }
  let g = '';
  for (let v = lo; v <= hi + 1e-9; v += step) g += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" class="ax">${fmt(v, step < 1 ? 1 : 0)}</text>`;
  if (timed){ let lastX = Infinity; const keep = [];
    for (let i = n-1; i >= 0; i--){ if (lastX - x(i) >= 46){ keep.push(i); lastX = x(i); } }
    keep.forEach(i => g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ax">${esc(pts[i].x)}</text>`);
  } else {
  const every = Math.max(1, Math.ceil(n / Math.max(1, Math.floor(pw/52))));
  pts.forEach((p, i) => { if (i % every === 0 || i === n-1) if (!(i !== n-1 && n-1 - i < every)) g += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" class="ax">${esc(p.x)}</text>`; }); }
  let marks = '';
  if (o.type === 'bar'){
    const bw = Math.max(4, Math.min(28, band*0.62));
    pts.forEach((p, i) => { const top = y(p.v), base = y(lo), h = Math.max(0, base - top), r = Math.min(4, bw/2, h);
      marks += `<path class="mk" d="M${x(i)-bw/2},${base} V${top+r} Q${x(i)-bw/2},${top} ${x(i)-bw/2+r},${top} H${x(i)+bw/2-r} Q${x(i)+bw/2},${top} ${x(i)+bw/2},${top+r} V${base} Z"/>`; });
  } else {
    if (o.fit){ const f = o.fit; const T = pts.map(p => p.t); const v0 = f.icpt + f.slope*T[0], v1 = f.icpt + f.slope*T[n-1];
      marks += `<line class="fit" x1="${x(0)}" y1="${y(v0)}" x2="${x(n-1)}" y2="${y(v1)}"/>`; }
    marks += `<path class="ln" d="${pts.map((p, i) => `${i ? 'L' : 'M'}${x(i)},${y(p.v)}`).join(' ')}"/>`;
    if (o.target){ const ty = y(o.target.v); marks += `<line class="tgt" x1="${m.l}" x2="${W-m.r}" y1="${ty}" y2="${ty}"/><text class="tgtl" x="${m.l+4}" y="${ty-5}">${esc(o.target.label)}</text>`; }
    pts.forEach((p, i) => marks += `<circle class="dot${p.hollow ? ' hollow' : ''}" cx="${x(i)}" cy="${y(p.v)}" r="4"/>`);
    const L = n-1; marks += `<text x="${Math.min(x(L), W-m.r-2)}" y="${y(pts[L].v)-10}" text-anchor="${n > 1 ? 'end' : 'middle'}" class="lab">${esc(o.fmt(pts[L].v))}</text>`;
  }
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${g}${marks}<line class="guide" y1="${m.t}" y2="${m.t+ph}" x1="0" x2="0" visibility="hidden"/><rect class="hit" x="${m.l}" y="${m.t}" width="${pw}" height="${ph}"/></svg><div class="tip" hidden></div>`;
  const svg = el.querySelector('svg'), tip = el.querySelector('.tip'), guide = el.querySelector('.guide');
  const show = ev => { const r = svg.getBoundingClientRect(); const px = ev.clientX - r.left;
    let i = Math.max(0, Math.min(n-1, Math.floor((px - m.l)/band)));
    if (timed){ let bd = Infinity; pts.forEach((_, j) => { const d = Math.abs(x(j) - px); if (d < bd){ bd = d; i = j; } }); }
    guide.setAttribute('x1', x(i)); guide.setAttribute('x2', x(i)); guide.setAttribute('visibility', 'visible');
    el.querySelectorAll('.mk,.dot').forEach((d, j) => d.classList.toggle('on', j === i));
    tip.innerHTML = pts[i].tip; tip.hidden = false;
    const tw = tip.offsetWidth; let left = x(i) + 10; if (left + tw > W) left = x(i) - tw - 10; tip.style.left = Math.max(0, left) + 'px'; tip.style.top = (m.t) + 'px'; };
  const hide = () => { tip.hidden = true; guide.setAttribute('visibility', 'hidden'); el.querySelectorAll('.on').forEach(d => d.classList.remove('on')); };
  svg.addEventListener('pointermove', show); svg.addEventListener('pointerdown', show); svg.addEventListener('pointerleave', hide);
}

function keepFocus(fn){
  const a = document.activeElement; const id = a && a.id; let st = null, en = null;
  try{ st = a.selectionStart; en = a.selectionEnd; }catch(e){}
  fn();

function snapshotAll(label){ const p = cur(); S.undo = {all:true, pid:p.id, weeks:clone(p.weeks), plan:clone(ensurePlan(p)), label}; }

function autoAllocate(pl){
  const k = pl.sessions.length; const tot = new Array(k).fill(0);
  pl.items.forEach(it => it.alloc = new Array(k).fill(''));
  const order = pl.items.map((it, i) => i).sort((a,b) => num(pl.items[b].sets) - num(pl.items[a].sets));
  for (const i of order){
    const it = pl.items[i]; const sets = Math.round(num(it.sets)); if (!sets) continue;
    const freq = Math.min(k, sets >= 9 ? 3 : sets >= 6 ? 2 : 1);
    const base = Math.floor(sets / freq); let extra = sets - base*freq;
    const chosen = [...tot.keys()].sort((a,b) => tot[a] - tot[b] || a - b).slice(0, freq).sort((a,b) => a - b);
    chosen.forEach(j => { const v = base + (extra > 0 ? 1 : 0); if (extra > 0) extra--; it.alloc[j] = String(v); tot[j] += v; });
  }
}
function applyPlan(p){
  const pl = ensurePlan(p);
  const start = Math.min(S.plStart ?? 0, p.weeks.length);
  const n = Math.max(1, Math.min(20, Math.round(num(S.plN ?? 4))));
  const pct = num(S.plPct ?? 2.5); const cyc = S.plCycle;
  snapshotAll(`Semaines S${start+1} à S${start+n} générées depuis le plan`);
  for (let w = 0; w < n; w++){
    const idx = start + w; const f = Math.pow(1 + pct/100, w);
    const week = p.weeks[idx] || {id:uid(), cycle:'', sessions:[]};
    week.sessions = pl.sessions.map((name, j) => ({id:uid(), name,
      rows: pl.items.filter(it => it.ex && allocOf(it, j) > 0).map(it => ({ex:it.ex, sets:String(allocOf(it, j)), reps:it.reps,
        load: num(it.load) ? String(Math.round(num(it.load)*f*2)/2) : it.load}))}));
    if (cyc != null && cyc !== '') week.cycle = cyc; else if (!week.cycle) week.cycle = p.weeks[idx-1]?.cycle || 'Bloc';
    p.weeks[idx] = week;
  }
  touch(); S.view = 'week'; S.wk = start; renderAll();
  setStatus(`S${start+1} à S${start+n} générées`);
}
function importWeek(p, wi){
  const pl = ensurePlan(p); const w = p.weeks[wi]; if (!w) return;
  snapshotAll(`Plan remplacé par le contenu de S${wi+1}`);
  pl.sessions = w.sessions.map(s => s.name || 'Séance');
  const map = new Map();
  w.sessions.forEach((s, j) => s.rows.forEach(r => { if (!r.ex) return; const key = norm(r.ex);
    if (!map.has(key)) map.set(key, {ex:r.ex, sets:0, reps:r.reps, load:r.load, alloc:new Array(w.sessions.length).fill('')});
    const it = map.get(key); it.sets += num(r.sets); it.alloc[j] = String(num(it.alloc[j]) + num(r.sets)); }));
  pl.items = [...map.values()].map(it => ({...it, sets:String(it.sets)}));
  touch(); renderAll();
}

function planClick(t, p){

  if (t.dataset.addplan !== undefined){ pl.items.push(planItem(t.dataset.addplan)); touch(); renderMain(); renderAside(); return true; }
  if (t.dataset.pldel !== undefined){ pl.items.splice(+t.dataset.pldel, 1); touch(); renderMain(); renderAside(); return true; }

    it.sets = String(Math.max(0, num(it.sets) + (t.dataset.plinc !== undefined ? 1 : -1))); touch(); renderMain(); renderAside(); return true; }

  if (t.dataset.psdel !== undefined){ const j = +t.dataset.psdel; pl.sessions.splice(j, 1); pl.items.forEach(it => it.alloc && it.alloc.splice(j, 1)); touch(); renderMain(); return true; }

  if (t.dataset.mus !== undefined){ S.openMus = S.openMus === t.dataset.mus ? null : t.dataset.mus; renderAside(); return true; }

}
function planInput(t, p, e){

/* sélecteur d'exercices */
const REGIONS = ['MI','MS','Athlétique','Tronc & cou','Perso'];

const F0 = {reg:'', cat:'', sub:'', mus:'', excl:'', sec:false, lvl:'', q:''};

const allEx = () => [...DATA.lib, ...S.custom.map(e => ({...e, cat:'Perso', sub:'Mes exercices'}))];
function pkFiltered(ignore){
  const q = norm(F.q);
  return allEx().filter(e => {
    if (ignore !== 'reg' && F.reg && regionOf(e.cat) !== F.reg) return false;
    if (ignore !== 'cat' && F.cat && e.cat !== F.cat) return false;
    if (ignore !== 'sub' && F.sub && e.sub !== F.sub) return false;
    if (F.excl && e.p.includes(F.excl)) return false;

    if (F.mus && !(e.p.includes(F.mus) || (F.sec && e.s.includes(F.mus)))) return false;
    if (q && !norm([e.name, e.fam, e.mat, e.sub].join(' ')).includes(q)) return false;
    return true;
  });
}
